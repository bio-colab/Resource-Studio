name: Feature request
description: Suggest a focused improvement to Resource Studio
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or developer problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful solution and its acceptance criteria.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Scope and safety
      options:
        - label: This proposal does not require bundling ResourceHacker.exe.
          required: true
        - label: This proposal preserves Save As and independent verification requirements.
          required: true
