name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-backend.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-backend.txt
      - name: Compile Python
        run: python -m compileall -q core mcp tests resource_studio_cli.py
      - name: Run Python gates
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/core/test_*.py tests/test_cli.py tests/qa/test_*.py; do
            PYTHONPATH=. python "$test"
          done
          PYTHONPATH=. python tests/test_mcp_stdio.py
          PYTHONPATH=. python tests/test_mcp_http.py
          PYTHONPATH=. python tests/test_mcp_persistence.py
          PYTHONPATH=. python tests/test_mcp_mutations.py
          PYTHONPATH=. python tests/test_mcp_plugins.py
      - name: Verify forbidden artifacts are absent
        shell: bash
        run: |
          ! find . -type f \( -iname '*.pdb' \) -print -quit | grep -q .

  windows:
    name: Windows Python and WPF
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-backend.txt
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install dependencies
        run: python -m pip install -r requirements-backend.txt
      - name: Compile Python
        shell: pwsh
        run: py -3.12 -m compileall -q core mcp tests resource_studio_cli.py
      - name: Run Python and Windows gates
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem tests\core\test_*.py | ForEach-Object { py -3.12 $_.FullName }
          py -3.12 tests\test_cli.py
          Get-ChildItem tests\qa\test_*.py | ForEach-Object { py -3.12 $_.FullName }
          py -3.12 tests\test_mcp_stdio.py
          py -3.12 tests\test_mcp_http.py
          py -3.12 tests\test_mcp_persistence.py
          py -3.12 tests\test_mcp_mutations.py
          py -3.12 tests\test_mcp_plugins.py
      - name: Verify forbidden source artifacts are absent
        shell: pwsh
        run: |
          $forbidden = Get-ChildItem -Recurse -File -ErrorAction SilentlyContinue | Where-Object { ($_.Extension -eq '.pdb' -and $_.FullName -notmatch '\\(bin|obj)\\') }
          if ($forbidden) { $forbidden | Select-Object -ExpandProperty FullName; exit 1 }
      - name: Build WPF
        run: dotnet build windows\ResourceStudio.Windows\ResourceStudio.Windows.csproj -c Release
      - name: Verify forbidden payloads are absent
        shell: pwsh
        run: |
          $forbidden = Get-ChildItem -Recurse -File -ErrorAction SilentlyContinue | Where-Object { ($_.Extension -eq '.pdb' -and $_.FullName -notmatch '\\(bin|obj)\\') }
          if ($forbidden) { $forbidden | Select-Object -ExpandProperty FullName; exit 1 }
      - name: Upload WPF build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpf-build-${{ github.run_id }}
          path: windows/ResourceStudio.Windows/bin/Release
          if-no-files-found: ignore
